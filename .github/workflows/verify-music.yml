name: Verify free music source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-music.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check approved Mixkit track delivery without distributing source music
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 1 --max-time 35 \
            --proto '=https' --output /tmp/licensed-music.mp3 \
            "https://assets.mixkit.co/active_storage/music/963/963.mp3"
          file /tmp/licensed-music.mp3
          bytes=$(wc -c </tmp/licensed-music.mp3)
          test "$bytes" -gt 300000
          test "$bytes" -lt 12000000
          ffprobe -v error -show_entries format=duration:stream=codec_name,codec_type \
            -of json /tmp/licensed-music.mp3
          python3 - <<'PY'
          import json, subprocess
          p=json.loads(subprocess.check_output([
              'ffprobe','-v','error','-show_entries','format=duration',
              '-of','json','/tmp/licensed-music.mp3'
          ]))
          seconds=float(p['format']['duration'])
          assert 120 <= seconds <= 132, 'Track length does not match Just Keep Walking'
          print(f'APPROVED TRACK DELIVERY OK: {seconds:.1f} seconds')
          PY
          rm -f /tmp/licensed-music.mp3
