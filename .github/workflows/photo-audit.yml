name: Audit candidate photographs (public source pages only)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/research/004-photo-candidate-pages.json"
      - "scripts/inspect_photo_candidates.py"
      - "scripts/inspect_commons_candidates.py"
      - ".github/workflows/photo-audit.yml"
permissions:
  contents: write
concurrency:
  group: travel-photo-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Audit public photo pages and commit preview evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git checkout -B main origin/main
            python scripts/inspect_photo_candidates.py
            python scripts/inspect_commons_candidates.py
            git add review/candidates/004-japan-beyond-the-cities/
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "Audit original photo candidates for Japan 004 [skip ci]"
            if git push origin HEAD:main; then exit 0; fi
          done
          exit 1
