name: Render travel carousels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/posts/**"
      - "scripts/render.py"
      - "scripts/build_review.py"
      - "requirements.txt"
      - ".github/workflows/render.yml"

permissions:
  contents: write

concurrency:
  group: travel-carousel-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free open-source dependencies
        run: python -m pip install -r requirements.txt
      - name: Check editorial layouts and omission gates
        run: python scripts/test_editorial_renderer.py
      - name: Render from current main and safely commit output
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            echo "Render/push attempt $attempt"
            git fetch origin main
            git checkout -B main origin/main
            python -m unittest discover -s tests
            python scripts/render.py
            python scripts/build_review.py
            git add media/ review/
            if git diff --cached --quiet; then
              echo "No changed assets."
              exit 0
            fi
            git commit -m "Render travel carousel assets [skip ci]"
            if git push origin HEAD:main; then
              echo "All updated assets committed."
              exit 0
            fi
            echo "Main changed during render; retrying against latest main."
          done
          echo "Could not push rendered assets after retrying."
          exit 1
