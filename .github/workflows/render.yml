name: Render travel carousels

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "content/posts/**"
      - "scripts/render.py"
      - "requirements.txt"
      - ".github/workflows/render.yml"

permissions:
  contents: write

concurrency:
  group: travel-carousel-render
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install free open-source dependencies
        run: python -m pip install -r requirements.txt
      - name: Render and verify source images
        run: python scripts/render.py
      - name: Commit public finished JPEG assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media/
          if git diff --cached --quiet; then
            echo "No changed assets."
          else
            git commit -m "Render travel carousel assets [skip ci]"
            git push
          fi
